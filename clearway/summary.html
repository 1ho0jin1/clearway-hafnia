<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearway shift summary</title>
<style>
  :root {
    --bg: #0d1015; --panel: #141920; --card: #1b2129; --line: #29313c;
    --text: #e7eaef; --muted: #939ca8; --faint: #5e6773;
    --high: #ef4d55; --medium: #f0a33b; --low: #4b9ef3; --ok: #39c98a;
    --bar: #8b9bb0;            /* magnitude: one neutral hue, apart from the priority colours */
    --radius: 10px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--text); }

  .top { display: flex; align-items: center; gap: 24px; padding: 10px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { width: 26px; height: 26px; border-radius: 7px; flex: none;
          background: linear-gradient(135deg, var(--ok), #1f8f61); position: relative; }
  .mark::after { content: ""; position: absolute; left: 6px; right: 6px; top: 11px; height: 4px; border-radius: 2px;
                 background: var(--panel); }
  .name { font-weight: 650; font-size: 17px; }
  .sub { color: var(--muted); font-size: 12px; }
  .nav { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  .nav a { text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .nav a:hover { border-color: var(--muted); }
  .notice { padding: 6px 16px; font-size: 12px; color: var(--muted); background: #11161c; border-bottom: 1px solid var(--line); }
  .notice div + div { margin-top: 3px; }
  .notice b { color: var(--text); font-weight: 600; }

  main { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 1600px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile.hero .value { font-size: 48px; line-height: 1.05; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
           min-width: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  h2 .h-note { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #1f262f; vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .owner { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pbar { width: 4px; height: 16px; border-radius: 2px; flex: none; }
  .barcell { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 2px; }
  .barcell .v { font-variant-numeric: tabular-nums; color: var(--text); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .summary-text { color: var(--muted); font-size: 12px; max-width: 520px; }
  .ai { display: inline-block; font-size: 10px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted);
        border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 6px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.on { color: var(--text); border-color: var(--high); }
  .pill.ok { color: var(--ok); border-color: #22684b; }

  .times { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .times .tile { background: var(--card); }
  /* hotspots (F9): a camera's scene, its spots outlined in the owner's priority colour, the heat of every change */
  .hot-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .hot-ctl { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .hot-ctl label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: 0 0 10px; align-items: center; }
  .legend .k { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 14px; height: 10px; border-radius: 2px; border: 2px solid; }
  .legend .sw.not { border-style: dashed; border-color: var(--muted); }
  .legend .ramp { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(106, 95, 208, .18), rgb(201, 194, 255)); }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
  .cam { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .view { position: relative; width: 100%; background: #000; overflow: hidden; }
  .view img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: grayscale(.5) brightness(.75); }
  .heat-on .view img { filter: grayscale(.7) brightness(.5); }
  .view canvas { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
  .view svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .no-heat .view canvas, .no-spots .view svg, .no-spots .view .tag { display: none; }
  .noimg { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; }
  .tag { position: absolute; transform: translateY(calc(-100% - 2px)); font-size: 11px; line-height: 1.35; white-space: nowrap;
         background: rgba(13, 16, 21, .86); color: var(--text); border-left: 3px solid; border-radius: 3px; padding: 0 5px;
         pointer-events: none; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
  .tag.inside { transform: translateY(2px); }
  .tag.not { color: var(--muted); border-left-style: dashed; border-left-color: var(--muted); }
  .tip { position: absolute; z-index: 1; background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;
         padding: 6px 8px; font-size: 12px; line-height: 1.45; pointer-events: none; max-width: 260px; }
  .tip .t { font-weight: 600; } .tip .m { color: var(--muted); }
  .cam figcaption { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .cam .cname { font-weight: 600; font-size: 13px; }
  .cam .cnote { font-size: 12px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .facts .k { color: var(--muted); }
  .empty { color: var(--faint); font-size: 12px; padding: 8px 0; }
  .stale .top { background: #2a1d10; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div><div class="name">Clearway · Shift summary</div><div class="sub" id="span">loading…</div></div>
  </div>
  <nav class="nav"><span class="muted" id="updated"></span><a href="/">Board</a></nav>
</header>
<div class="notice" id="notice" hidden></div>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="row">
    <div class="panel"><h2>By owner</h2><div class="scroll"><table id="owners"></table></div></div>
    <div class="panel"><h2>How fast <span class="h-note">medians</span></h2><div class="times" id="times"></div></div>
  </section>
  <section class="panel" id="hot">
    <div class="hot-head">
      <h2>Where it keeps happening <span class="h-note" id="hot-note"></span></h2>
      <div class="hot-ctl">
        <label><input type="checkbox" id="show-spots" checked> Spots</label>
        <label><input type="checkbox" id="show-heat" checked> Heat of all changes</label>
      </div>
    </div>
    <div class="legend" id="hot-legend"></div>
    <div class="cams" id="cams"></div>
  </section>
  <section class="panel"><h2>Incidents</h2><div class="scroll"><table id="incidents"></table></div></section>
  <section class="row">
    <div class="panel"><h2>What it cost <span class="h-note" id="cost-note"></span></h2><div id="cost"></div></div>
    <div class="panel"><h2>Operator</h2><div id="operator"></div></div>
  </section>
</main>
<script>
"use strict";
const CATEGORY = { PERSON_ON_TRACKS: "Person on the tracks", COLLISION: "Collision", STALLED_VEHICLE: "Stalled vehicle",
                   OBSTRUCTION: "Obstruction", DAMAGE: "Damage", TAMPERING: "Tampering" };
const PRIORITY = { "Rail control": "high", "Traffic operations": "high", "Street services": "medium",
                   "Asset owner": "low", "Security": "low" };
const $ = (id) => document.getElementById(id);
const human = (s) => s.replace(/_/g, " ");
const cat = (c) => CATEGORY[c] || human(c);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hms(t) { return new Date(t * 1000).toISOString().slice(11, 19); }
function secs(s) {                 // operator time: seconds on loops, minutes on real streets
  if (s == null) return "–";
  if (s < 90) return `${s < 10 ? s.toFixed(1) : Math.round(s)} s`;
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  if (s < 3600) return `${m} min ${String(r).padStart(2, "0")} s`;
  return `${Math.floor(s / 3600)} h ${String(m % 60).padStart(2, "0")} min`;
}
function tile(label, value, note, hero) {
  const t = el("div", "tile" + (hero ? " hero" : ""));
  t.append(el("div", "label", label), el("div", "value", value));
  if (note) t.append(el("div", "note", note));
  return t;
}
function barCell(v, max, label, title) {
  const c = el("div", "barcell"), b = el("div", "bar");
  b.style.width = `${max ? Math.max(2, 120 * v / max) : 2}px`;
  b.title = title || `${label ?? v}`;
  c.append(b, el("span", "v", label ?? String(v)));
  return c;
}
function table(t, head, rows) {
  const tr = el("tr");
  head.forEach(([h, num]) => tr.append(el("th", num ? "num" : null, h)));
  t.replaceChildren(tr, ...rows.map(cells => {
    const r = el("tr");
    cells.forEach(([v, num]) => { const td = el("td", num ? "num" : null); if (v instanceof Node) td.append(v); else td.textContent = v ?? "–"; r.append(td); });
    return r;
  }));
}
function ownerCell(owner) {
  const d = el("div", "owner"), p = el("span", "pbar");
  p.style.background = `var(--${PRIORITY[owner] || "faint"})`;
  d.append(p, el("span", null, owner));
  return d;
}

function render(s) {
  document.body.classList.remove("stale");
  const live = !s.ended;
  $("span").textContent = `${s.run} · ${hms(s.started)}–${hms(s.until)} UTC · ${secs(s.hours * 3600)}` +
    ` · ${s.cameras.length} cameras` + (live ? " · live, so far" : "");
  $("updated").textContent = live ? `updated ${hms(Date.now() / 1000)} UTC` : "";

  const notes = [];
  if (s.mode === "dry") notes.push(["Dry run: ", "answers came from the test stand-in, not from Hafnia; costs are questions, not requests."]);
  if (s.looped_cameras.length) notes.push(["Looped clips: ", `${s.looped_cameras.length} of ${s.cameras.length} cameras play the organizers' clips, which restart every 8–17 s. An occurrence there is a replay of one incident, so times are seconds and "keeps happening" counts replays.`]);
  if (s.cost.short_run) notes.push(["Short run: ", "every incident's first question comes at once at the start, so rates per hour and per day are far above a steady shift's."]);
  const notice = $("notice");
  notice.hidden = !notes.length;
  notice.replaceChildren(...notes.map(([b, t]) => { const d = el("div"); d.append(el("b", null, b), document.createTextNode(t)); return d; }));

  const t = s.times_s;
  $("kpis").replaceChildren(
    tile("Incidents", String(s.incidents), `${s.open_at_end} open ${live ? "now" : "at the end"}`, true),
    tile("Times they happened", String(s.occurrences), "occurrences on the cards"),
    tile("Spot changed to card", secs(t.change_to_card_first.median), `first time; repeats ${secs(t.change_to_card_repeat.median)}`),
    tile(s.cost.dry ? "Questions" : "Hafnia requests", String(s.cost.total), `${s.cost.without_a_question} of ${s.cost.changes} changes needed none`),
    tile("False cards", String(s.false_cards), "rejected by the operator"),
  );

  const maxInc = Math.max(1, ...s.by_owner.map(o => o.incidents)), maxOcc = Math.max(1, ...s.by_owner.map(o => o.occurrences));
  table($("owners"), [["Owner"], ["Incidents"], ["Occurrences"], ["To card", 1], ["Open, total", 1], ["Longest", 1]],
    s.by_owner.map(o => [[ownerCell(o.owner)], [barCell(o.incidents, maxInc, `${o.incidents}${o.open_at_end ? ` (${o.open_at_end} open)` : ""}`)],
      [barCell(o.occurrences, maxOcc)], [secs(o.to_card_s_median), 1], [o.incidents ? secs(o.open_s_total) : "–", 1],
      [secs(o.longest_s), 1]]));

  $("times").replaceChildren(
    tile("Change to card, first time", secs(t.change_to_card_first.median), `max ${secs(t.change_to_card_first.max)}: the lens queue and Hafnia`),
    tile("Change to card, repeat", secs(t.change_to_card_repeat.median), `${t.change_to_card_repeat.n} repeats, no request`),
    tile("Card to XProtect alarm", secs(t.card_to_xprotect_alarm.median), t.card_to_xprotect_alarm.n ? `${t.card_to_xprotect_alarm.n} alarms raised` : "no alarms in this run"),
    tile("Change to owner told", secs(t.change_to_owner_told.median),
      s.notifications.sent || s.notifications.failed ? `${s.notifications.sent} messages sent, ${s.notifications.failed} failed` : "no owner notifications in this run"),
    tile("Alarm to clear", secs(t.alarm_to_clear.median), `${t.alarm_to_clear.n} alarms; ${t.alarm_to_clear.cleared_before_alarm} cleared before theirs`),
    tile("Clear to alarm closed", secs(t.clear_to_alarm_closed.median), t.clear_to_alarm_closed.n ? `${t.clear_to_alarm_closed.n} closed by themselves` : "none closed by themselves"),
    tile("Occurrence", secs(t.occurrence.median), `${t.occurrence.n} that cleared`),
  );

  renderHotspots(s);

  table($("incidents"), [["Incident"], ["Camera"], ["Owner"], ["First seen", 1], ["Times", 1], ["To card", 1], ["Time open", 1], ["Longest", 1], [live ? "Now" : "At the end"], ["Hafnia said"]],
    s.list.map(x => {
      const now = el("span", "pill" + (x.open_at_end ? " on" : x.operator === "confirmed" ? " ok" : ""),
        x.open_at_end ? "open" : "cleared");
      const state = el("div"); state.append(now);
      if (x.operator === "confirmed") state.append(document.createTextNode(" "), el("span", "pill ok", "confirmed"));
      const said = el("div", "summary-text");
      if (x.summary) said.append(el("span", "ai", "AI · Hafnia"), document.createTextNode(x.summary));
      else said.textContent = s.mode === "dry" ? "dry run" : "–";
      return [[cat(x.category)], [human(x.camera)], [ownerCell(x.owner)], [hms(x.first_seen), 1], [String(x.occurrences), 1],
              [secs(x.to_card_s), 1], [secs(x.open_s), 1], [secs(x.longest_s), 1], [state], [said]];
    }));

  const c = s.cost, maxReq = Math.max(1, ...Object.values(c.by_camera));
  $("cost-note").textContent = c.dry ? "questions the stand-in answered" : "Hafnia requests";
  const ct = el("table");
  table(ct, [["Camera"], [c.dry ? "Questions" : "Requests"]],
    Object.entries(c.by_camera).map(([cam, n]) => [[human(cam)], [barCell(n, maxReq)]]));
  const facts = el("div", "facts");
  const fact = (k, v) => facts.append(el("span", "k", k), el("span", null, v));
  fact("Changes seen", `${c.changes}: ${c.recurrences} repeats, ${c.pieces} pieces, ${c.skipped} skipped as known harmless, ${c.escalated} asked after all`);
  fact("Per camera-hour", `${c.per_camera_hour} ${c.dry ? "questions" : "requests"}`);
  fact("500 a day covers", c.cameras_per_allowance == null ? "–" : `${c.cameras_per_allowance} cameras at this rate${c.short_run ? " (short run: see the note)" : ""}`);
  facts.style.marginTop = "12px";
  $("cost").replaceChildren(ct, facts);

  const o = s.operator, of = el("div", "facts");
  const ofact = (k, v) => of.append(el("span", "k", k), el("span", null, v));
  ofact("Confirmed", String(o.confirmed));
  ofact("Rejected", `${o.rejected} (false cards: ${o.false_cards_per_camera_hour} per camera-hour)`);
  ofact("Later look-alikes skipped", `${o.skipped_like_rejected}, because of the rejections`);
  $("operator").replaceChildren(of);
  return live;
}

// --- hotspots (F9) ---------------------------------------------------------------------------------------------
const SVGNS = "http://www.w3.org/2000/svg";
const HEAT_LO = [106, 95, 208], HEAT_HI = [201, 194, 255];   // one hue (violet), apart from the priority colours
const LABELLED_NOT = 3;            // spots that were not incidents get a label on the image this many per camera
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const spotColour = (sp) => sp.kind === "incident" ? `var(--${PRIORITY[sp.owner] || "faint"})` : "var(--muted)";

function spotLabel(sp) {
  if (sp.kind === "incident") return `${cat(sp.category)} ×${sp.count}`;
  return `${sp.kind === "rejected" ? "rejected" : "not an incident"} ×${sp.count}`;
}
function spotTip(sp) {
  const lines = [];
  if (sp.kind === "incident") {
    lines.push([cat(sp.category), "t"], [`${sp.owner} · happened ${plural(sp.occurrences, "time")}`]);
    if (sp.operator === "confirmed") lines.push(["confirmed by the operator"]);
  } else if (sp.kind === "rejected") {
    lines.push([`${cat(sp.category)} card, rejected by the operator`, "t"],
               [`happened ${plural(sp.occurrences, "time")}; ${plural(sp.skipped, "later look-alike")} skipped`]);
  } else {
    lines.push(["Not an incident, said Hafnia", "t"],
               [`asked ${plural(sp.ids.length, "time")}; ${plural(sp.skipped, "later look-alike")} skipped without asking`]);
  }
  lines.push([sp.ids.join(", "), "m"]);
  return lines;
}
function heatCanvas(c, h) {
  const cv = document.createElement("canvas");
  cv.width = c.cols; cv.height = c.rows;            // one pixel per cell, smoothed by the browser as it scales
  cv.style.width = `${100 * c.cols * h.cell / c.size[0]}%`;
  cv.style.height = `${100 * c.rows * h.cell / c.size[1]}%`;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(c.cols, c.rows);
  c.heat.forEach((n, i) => {
    if (!n) return;
    const f = Math.sqrt(n / h.heat_max);               // the same scale on every camera
    for (let k = 0; k < 3; k++) img.data[4 * i + k] = Math.round(HEAT_LO[k] + f * (HEAT_HI[k] - HEAT_LO[k]));
    img.data[4 * i + 3] = Math.round(255 * (0.18 + 0.67 * f));
  });
  ctx.putImageData(img, 0, 0);
  return cv;
}
function hover(ev, view, tip, c, h) {
  const r = view.getBoundingClientRect(), [w, hh] = c.size;
  const x = (ev.clientX - r.left) / r.width * w, y = (ev.clientY - r.top) / r.height * hh;
  const area = (b) => (b[2] - b[0]) * (b[3] - b[1]);
  let lines = null;
  if (!document.body.classList.contains("no-spots")) {
    const under = c.spots.filter(sp => x >= sp.box[0] && x <= sp.box[2] && y >= sp.box[1] && y <= sp.box[3])
                         .sort((a, b) => area(a.box) - area(b.box));
    if (under.length) lines = spotTip(under[0]);
  }
  if (!lines && c.heat && !document.body.classList.contains("no-heat")) {
    const n = c.heat[Math.floor(y / h.cell) * c.cols + Math.floor(x / h.cell)] || 0;
    if (n) lines = [[`${plural(n, "change")} reported here`, "t"], ["by the detector or a danger zone, card or not", "m"]];
  }
  if (!lines) { tip.hidden = true; return; }
  tip.replaceChildren(...lines.map(([t, cls]) => el("div", cls || null, t)));
  tip.hidden = false;
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  tip.style.left = `${Math.max(4, Math.min(px + 12, r.width - tip.offsetWidth - 4))}px`;
  tip.style.top = `${py + 16 + tip.offsetHeight > r.height ? Math.max(4, py - tip.offsetHeight - 8) : py + 16}px`;
}
function camCard(c, h) {
  const fig = el("figure", "cam");
  if (!c.image) fig.append(el("div", "noimg", "no camera image in this run"));
  else {
    const [w, hh] = c.size, view = el("div", "view");
    view.style.aspectRatio = `${w} / ${hh}`;
    const img = el("img");
    img.src = c.image; img.alt = `${human(c.camera)}: the scene`;
    view.append(img);
    if (c.heat) view.append(heatCanvas(c, h));
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${w} ${hh}`);
    svg.setAttribute("preserveAspectRatio", "none");
    for (const sp of [...c.spots].reverse()) {          // incidents come first: drawn last, on top
      const [x1, y1, x2, y2] = sp.box;
      for (const [stroke, width] of [["rgba(0, 0, 0, .6)", 4], [spotColour(sp), 2]]) {
        const rect = document.createElementNS(SVGNS, "rect");
        for (const [k, v] of Object.entries({ x: x1, y: y1, width: x2 - x1, height: y2 - y1, rx: 3, fill: "none",
                                              "stroke-width": width, "vector-effect": "non-scaling-stroke" }))
          rect.setAttribute(k, v);
        rect.style.stroke = stroke;
        if (sp.kind !== "incident" && width === 2) rect.setAttribute("stroke-dasharray", "5 4");
        svg.append(rect);
      }
    }
    view.append(svg);
    let nots = 0;
    for (const sp of c.spots) {
      if (sp.kind !== "incident" && ++nots > LABELLED_NOT) continue;
      const tag = el("div", "tag" + (sp.kind === "incident" ? "" : " not"), spotLabel(sp));
      if (sp.box[0] / w > 0.55) tag.style.right = `${100 - 100 * sp.box[2] / w}%`;   // keep it inside the image
      else tag.style.left = `${100 * sp.box[0] / w}%`;
      tag.style.top = `${100 * sp.box[1] / hh}%`;
      if (sp.box[1] / hh < 0.08) tag.classList.add("inside");
      if (sp.kind === "incident") tag.style.borderLeftColor = spotColour(sp);
      view.append(tag);
    }
    const tip = el("div", "tip");
    tip.hidden = true;
    view.append(tip);
    view.addEventListener("mousemove", ev => hover(ev, view, tip, c, h));
    view.addEventListener("mouseleave", () => { tip.hidden = true; });
    fig.append(view);
  }
  const inc = c.spots.filter(sp => sp.kind === "incident").length, not = c.spots.length - inc;
  const cap = el("figcaption");
  cap.append(el("div", "cname", human(c.camera)),
             el("div", "cnote", [plural(inc, "incident spot"), not ? `${not} not an incident` : null,
                                 `${plural(c.changes, "change")} reported`].filter(Boolean).join(" · ")));
  if (c.image_kind === "snapshot") cap.append(el("div", "cnote", "image: a question's snapshot (no scene image in this run)"));
  fig.append(cap);
  return fig;
}
function renderHotspots(s) {
  const h = s.hotspots;
  $("hot").hidden = !h;
  if (!h) return;
  $("hot-note").textContent = s.looped_cameras.length ? "on looped clips a count is replays of one incident" : "";
  const byPriority = {};
  for (const c of h.cameras) for (const sp of c.spots)
    if (sp.kind === "incident") (byPriority[PRIORITY[sp.owner] || "faint"] ||= new Set()).add(sp.owner);
  const key = (sw, text) => { const k = el("span", "k"); k.append(sw, document.createTextNode(text)); return k; };
  const items = ["high", "medium", "low"].filter(p => byPriority[p]).map(p => {
    const sw = el("span", "sw"); sw.style.borderColor = `var(--${p})`;
    return key(sw, `${p[0].toUpperCase()}${p.slice(1)}: ${[...byPriority[p]].join(", ")}`);
  });
  if (h.cameras.some(c => c.spots.some(sp => sp.kind !== "incident")))
    items.push(key(el("span", "sw not"), "not an incident (Hafnia or the operator)"));
  const ramp = el("span", "k");
  ramp.append(document.createTextNode("1"), el("span", "ramp"), document.createTextNode(`${h.heat_max} changes at one spot, every camera on this scale`));
  items.push(ramp);
  $("hot-legend").replaceChildren(...items);
  $("cams").replaceChildren(...h.cameras.map(c => camCard(c, h)));
  unstackAll();
}
function unstackAll() {            // a label that would cover an earlier one moves down below it
  for (const view of document.querySelectorAll(".view")) {
    const placed = [];
    for (const tag of view.querySelectorAll(".tag")) {
      tag.style.marginTop = "0px";
      let r = tag.getBoundingClientRect();
      for (let i = 0; i < 8 && r.width; i++) {
        const hit = placed.find(p => r.left < p.right && r.right > p.left && r.top < p.bottom && r.bottom > p.top);
        if (!hit) break;
        tag.style.marginTop = `${parseFloat(tag.style.marginTop) + hit.bottom - r.top + 1}px`;
        r = tag.getBoundingClientRect();
      }
      placed.push(r);
    }
  }
}
let resizing = 0;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(unstackAll, 150); });
function setToggles() {
  const spots = $("show-spots").checked, heat = $("show-heat").checked;
  document.body.classList.toggle("no-spots", !spots);
  document.body.classList.toggle("no-heat", !heat);
  document.body.classList.toggle("heat-on", heat);
  try { localStorage.setItem("clearway.hotspots", JSON.stringify({ spots, heat })); } catch (e) { /* private window */ }
  unstackAll();
}
try {
  const saved = JSON.parse(localStorage.getItem("clearway.hotspots") || "null");
  if (saved) { $("show-spots").checked = !!saved.spots; $("show-heat").checked = !!saved.heat; }
} catch (e) { /* no storage: the defaults */ }
$("show-spots").addEventListener("change", setToggles);
$("show-heat").addEventListener("change", setToggles);
setToggles();

async function load() {
  let live = true;
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    live = render(await r.json());
  } catch (e) {
    document.body.classList.add("stale");
  } finally {
    if (live) setTimeout(load, 15000);
  }
}
load();
</script>
