<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Clearway pipeline: cameras, change detector and person zones, SigLIP fingerprint, seen at this spot? Known: no request. New: one Hafnia request on the camera's recording or the lens, then an XProtect alarm, the owner board and a phone push.</title>
  <style>
    .bg    { fill: #ffffff; }
    .io    { fill: #ffffff; stroke: #8c959f; stroke-width: 1.6; }
    .mine  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.6; }
    .model { fill: #fbefff; stroke: #c297ff; stroke-width: 1.6; }
    .vlm   { fill: #fff1e5; stroke: #fb8f44; stroke-width: 2.2; }
    .out   { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.6; }
    .quiet { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .h1    { fill: #1f2328; font-size: 34px; font-weight: 700; }
    .sub   { fill: #59636e; font-size: 19px; }
    .t     { fill: #1f2328; font-size: 22px; font-weight: 600; text-anchor: middle; }
    .s     { fill: #59636e; font-size: 17px; text-anchor: middle; }
    .m     { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; text-anchor: middle; }
    .lbl   { fill: #59636e; font-size: 17px; font-style: italic; }
    .e     { fill: none; stroke: #59636e; stroke-width: 2; }
    .fb    { fill: none; stroke: #8250df; stroke-width: 2; stroke-dasharray: 7 5; }
    .fbl   { fill: #8250df; font-size: 17px; font-weight: 600; }
    .ah    { fill: #59636e; }
    .fah   { fill: #8250df; }
    .lg    { fill: #59636e; font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .io    { fill: #0d1117; stroke: #656c76; }
      .mine  { fill: #0c2d4b; stroke: #388bfd; }
      .model { fill: #2a1d45; stroke: #a371f7; }
      .vlm   { fill: #3d1e00; stroke: #f0883e; }
      .out   { fill: #0f3a1e; stroke: #3fb950; }
      .quiet { fill: #161b22; stroke: #656c76; }
      .h1, .t, .m { fill: #e6edf3; }
      .sub, .s, .lbl, .lg { fill: #9198a1; }
      .e     { stroke: #9198a1; }
      .ah    { fill: #9198a1; }
      .fb    { stroke: #a371f7; }
      .fbl, .fah { fill: #a371f7; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="ah"/>
    </marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="fah"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="1040"/>

  <text class="h1" x="30" y="54">Clearway</text>
  <text class="sub" x="30" y="88">Ask Hafnia once per incident, not once per minute.</text>

  <!-- Cameras -->
  <rect class="io" x="30" y="125" width="600" height="76" rx="10"/>
  <text class="t" x="330" y="158">XProtect cameras</text>
  <text class="s" x="330" y="185">live frames via FrameBridge, 10 fps</text>

  <path class="e" d="M176 201 V241" marker-end="url(#a)"/>
  <path class="e" d="M484 201 V241" marker-end="url(#a)"/>

  <!-- Tier 0 -->
  <rect class="mine" x="30" y="245" width="292" height="84" rx="10"/>
  <text class="t" x="176" y="281">Change detector</text>
  <text class="s" x="176" y="308">a change that stays</text>

  <rect class="model" x="338" y="245" width="292" height="84" rx="10"/>
  <text class="t" x="484" y="281">YOLO11m</text>
  <text class="s" x="484" y="308">a person on the tracks</text>

  <path class="e" d="M176 329 V350 H484 V329"/>
  <path class="e" d="M330 350 V371" marker-end="url(#a)"/>

  <!-- Fingerprint -->
  <rect class="model" x="30" y="375" width="600" height="76" rx="10"/>
  <text class="t" x="330" y="408">SigLIP 2 fingerprint</text>
  <text class="s" x="330" y="435">of the changed spot</text>

  <path class="e" d="M330 451 V476" marker-end="url(#a)"/>

  <!-- Ledger decision -->
  <polygon class="mine" points="330,480 490,535 330,590 170,535"/>
  <text class="t" x="330" y="530" style="font-size:20px">Seen at</text>
  <text class="t" x="330" y="555" style="font-size:20px">this spot?</text>

  <path class="e" d="M490 535 H666" marker-end="url(#a)"/>
  <text class="lbl" x="550" y="524">known</text>

  <rect class="quiet" x="670" y="480" width="260" height="110" rx="10"/>
  <text class="t" x="800" y="518">No request</text>
  <text class="s" x="800" y="546">joins its incident,</text>
  <text class="s" x="800" y="569">or held if rejected</text>

  <path class="e" d="M330 590 V620 H176 V641" marker-end="url(#a)"/>
  <path class="e" d="M330 620 H484 V641" marker-end="url(#a)"/>
  <text class="lbl" x="340" y="612">new</text>

  <!-- What Hafnia is shown -->
  <rect class="io" x="30" y="645" width="292" height="84" rx="10"/>
  <text class="t" x="176" y="681">Large spot</text>
  <text class="s" x="176" y="708">the camera's recording</text>

  <rect class="mine" x="338" y="645" width="292" height="84" rx="10"/>
  <text class="t" x="484" y="681">Small spot</text>
  <text class="s" x="484" y="708">enlarged on lens_1</text>

  <path class="e" d="M176 729 V750 H484 V729"/>
  <path class="e" d="M330 750 V771" marker-end="url(#a)"/>

  <!-- Hafnia -->
  <rect class="vlm" x="30" y="775" width="600" height="110" rx="12"/>
  <text class="t" x="330" y="812" style="font-size:24px">Hafnia VLM · 1 request</text>
  <text class="m" x="330" y="842">{"category": "STALLED_VEHICLE", …}</text>
  <text class="s" x="330" y="870">the category picks the owner and priority</text>

  <path class="e" d="M330 885 V905 H124 V926" marker-end="url(#a)"/>
  <path class="e" d="M330 905 V926" marker-end="url(#a)"/>
  <path class="e" d="M330 905 H536 V926" marker-end="url(#a)"/>

  <!-- One incident -->
  <rect class="out" x="30" y="930" width="188" height="78" rx="10"/>
  <text class="t" x="124" y="962" style="font-size:20px">XProtect alarm</text>
  <text class="s" x="124" y="989" style="font-size:16px">with bookmarks</text>

  <rect class="out" x="236" y="930" width="188" height="78" rx="10"/>
  <text class="t" x="330" y="962" style="font-size:20px">Owner board</text>
  <text class="s" x="330" y="989" style="font-size:16px">one card</text>

  <rect class="out" x="442" y="930" width="188" height="78" rx="10"/>
  <text class="t" x="536" y="962" style="font-size:20px">Phone push</text>
  <text class="s" x="536" y="989" style="font-size:16px">Confirm / Reject</text>

  <!-- Feedback into the memory -->
  <path class="fb" d="M630 969 H800 V594" marker-end="url(#f)"/>
  <path class="fb" d="M630 830 H800"/>
  <text class="fbl" x="646" y="820">NONE</text>
  <text class="fbl" x="646" y="959">Reject</text>
  <text class="fbl" x="814" y="700">teaches</text>
  <text class="fbl" x="814" y="722">the memory</text>
</svg>
