# MediaMTX for the lens camera: one RTSP server on the loopback interface only, TCP only, nothing else.
# Started by scripts\start_lens.ps1. Keys not set here take MediaMTX's defaults, so every other protocol is switched
# off explicitly (their defaults are on and would listen on all interfaces).
logLevel: info
logDestinations: [stdout]

api: false
metrics: false
pprof: false
playback: false
rtmp: false
hls: false
webrtc: false
srt: false
moq: false

rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1/32', '::1/128']
    permissions:
      - action: publish
      - action: read

paths:
  all_others:
